services:
  database:
    image: postgres:16-alpine
    container_name: familyfoodplan-database
    restart: unless-stopped

    environment:
      POSTGRES_DB: familyfoodplan
      POSTGRES_USER: familyfoodplan
      POSTGRES_PASSWORD: familyfoodplan

    ports:
      - "55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app


  backend:
    image: node:22-alpine
    container_name: familyfoodplan-backend
    restart: unless-stopped

    depends_on:
      - database

    working_dir: /app

    command: >
      sh -c "
        apk add --no-cache openssl >/dev/null &&
        npm install &&
        npm run prisma:generate &&
        npx prisma migrate deploy &&
        npx prisma db seed &&
        npm run dev
      "

    environment:
      NODE_ENV: development
      PORT: 4000

      DATABASE_URL: postgresql://familyfoodplan:familyfoodplan@database:5432/familyfoodplan

      # Internal Docker addresses
      BACKEND_URL: http://backend:4000
      FRONTEND_URL: http://frontend:3000

      # Public browser-facing addresses
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://familyfoodplan.hagh.dk}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://familyfoodplan.hagh.dk}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-strong-password}

      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-60}

      # Push notifications. Generate once with: pnpm --dir backend push:vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:no-reply@example.com}

      DINNER_REMINDER_ENABLED: ${DINNER_REMINDER_ENABLED:-true}
      DINNER_REMINDER_HOUR: ${DINNER_REMINDER_HOUR:-10}
      DINNER_REMINDER_MINUTE: ${DINNER_REMINDER_MINUTE:-0}
      DINNER_REMINDER_TIMEZONE: ${DINNER_REMINDER_TIMEZONE:-Europe/Copenhagen}

      PANTRY_EXPIRY_REMINDER_ENABLED: ${PANTRY_EXPIRY_REMINDER_ENABLED:-true}
      PANTRY_EXPIRY_REMINDER_HOUR: ${PANTRY_EXPIRY_REMINDER_HOUR:-9}
      PANTRY_EXPIRY_REMINDER_MINUTE: ${PANTRY_EXPIRY_REMINDER_MINUTE:-0}
      PANTRY_EXPIRY_WARNING_DAYS: ${PANTRY_EXPIRY_WARNING_DAYS:-3}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      MAIL_FROM: ${MAIL_FROM:-Family Food Planner <no-reply@example.com>}

      COMMIT_SHA: "dee5d8bb7a9056afe555169cbf271240c7b00755"

    ports:
      - "4100:4000"

    volumes:
      - ./backend:/app

    networks:
      app:
        aliases:
          - backend
      proxy:
        aliases:
          - familyfoodplan-backend


  frontend:
    image: node:22-alpine
    container_name: familyfoodplan-frontend
    restart: unless-stopped

    depends_on:
      - backend

    working_dir: /app

    command: >
      sh -c "
        npm install &&
        npm run dev -- --hostname 0.0.0.0 --port 3000
      "

    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://familyfoodplan:familyfoodplan@database:5432/familyfoodplan

      # Internal Docker addresses
      BACKEND_URL: http://backend:4000
      FRONTEND_URL: http://frontend:3000

      # Public browser-facing addresses
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://familyfoodplan.hagh.dk}
      NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-https://api.familyfoodplan.hagh.dk}

    ports:
      - "3100:3000"

    volumes:
      - ./frontend:/app

    networks:
      app:
        aliases:
          - frontend
      proxy:
        aliases:
          - familyfoodplan-frontend


volumes:
  postgres_data:
    name: familyfoodplan-postgres-data


networks:
  app:
    name: familyfoodplan-app

  proxy:
    external: true
    name: proxy
