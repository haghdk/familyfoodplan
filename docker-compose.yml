services:
  database:
    image: postgres:16-alpine
    container_name: familyfoodplan-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyfoodplan
      POSTGRES_USER: familyfoodplan
      POSTGRES_PASSWORD: familyfoodplan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: node:22-alpine
    container_name: familyfoodplan-backend
    restart: unless-stopped
    depends_on:
      - database
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://familyfoodplan:familyfoodplan@database:5432/familyfoodplan
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app

  frontend:
    image: node:22-alpine
    container_name: familyfoodplan-frontend
    restart: unless-stopped
    depends_on:
      - backend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
